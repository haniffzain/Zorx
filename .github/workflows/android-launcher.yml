name: Android Launcher

on:
  push:
    branches:
      - development
      - "codex/**"
  pull_request:
    paths:
      - "launcher/ZorxLauncher/**"
      - ".github/workflows/android-launcher.yml"

permissions:
  contents: read

concurrency:
  group: android-launcher-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: launcher/ZorxLauncher

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: zorx-launcher-debug
          path: launcher/ZorxLauncher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
